<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messaggi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0a00; }
  canvas { display: block; }

  /* Upload bg button */
  #bg-btn {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(0,0,0,0.45); color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    font-family: 'Caveat', cursive; font-size: 1rem;
    padding: 8px 16px; cursor: pointer; z-index: 100;
    border-radius: 4px; transition: background 0.2s;
  }
  #bg-btn:hover { background: rgba(0,0,0,0.7); color: #fff; }
  #bg-file { display: none; }

  /* URL panel */
  #panel {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.82);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 40px 48px; z-index: 200;
    max-width: 480px; width: 90%;
    font-family: 'Caveat', cursive;
    border-radius: 8px;
  }
  #panel h2 { color: #f0e6d0; font-size: 1.6rem; margin-bottom: 20px; font-weight: 400; }
  #panel input {
    width: 100%; background: transparent;
    border: none; border-bottom: 1px solid rgba(255,255,255,0.2);
    color: #f0e6d0; font-family: 'Caveat', cursive;
    font-size: 1.1rem; padding: 8px 0; outline: none;
    margin-bottom: 24px;
  }
  #panel button {
    background: #f0e6d0; color: #1a0a00; border: none;
    padding: 10px 28px; font-family: 'Caveat', cursive;
    font-size: 1.1rem; cursor: pointer; border-radius: 4px;
    width: 100%;
  }
  #panel button:hover { background: #e8d5a3; }
  #err { color: #c0392b; font-size: 0.95rem; margin-top: 10px; min-height: 20px; }
</style>
</head>
<body>

<div id="panel">
  <h2>Messaggi ✦</h2>
  <input type="text" id="su" placeholder="URL Apps Script..." />
  <button onclick="startApp()">Avvia</button>
  <div id="err"></div>
</div>

<button id="bg-btn" onclick="document.getElementById('bg-file').click()">⬆ sfondo</button>
<input type="file" id="bg-file" accept="image/*" onchange="loadBg(this)">

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const HARDCODED_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRJxJS7EchP94_xSW_1dkS_YofW84E5iYrKnA-KmxUyt7g_YDUmUgBDLDZPETQ-Jpr3Cd2h_A6eykOT/pub?output=csv';          // metti qui il tuo URL Apps Script
const COL_NAME      = 'Scrivi qualcosa <3';
// ─────────────────────────────────────────────────────────────────────────────

window._state = {
  started: false,
  scriptUrl: HARDCODED_URL,
  colName: COL_NAME,
  messages: [],
  bannedMessages: new Set(),
  knownMessages: new Set(),
  bgImage: null,
};

if (HARDCODED_URL) {
  document.getElementById('panel').style.display = 'none';
  window._state.started = true;
  fetchMessages();
  setInterval(fetchMessages, 2000);
}

async function fetchMessages() {
  const s = window._state;
  if (!s.scriptUrl) return;
  try {
    const res = await fetch('https://script.google.com/macros/s/AKfycbwLUi0-47gEtudq0WJqEMPCle8BiAfyAVhTZsszr6OW4TThxOBnmFTSIeogUFSJHG3k/exec', { cache: 'no-store', redirect: 'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    for (const row of rows) {
      const keys = Object.keys(row);
      const val = row[s.colName] !== undefined ? row[s.colName] : row[keys[1]];
      const msg = (val || '').toString().trim();
      if (!msg) continue;
      if (!s.knownMessages.has(msg) && !s.bannedMessages.has(msg)) {
        s.knownMessages.add(msg);
        s.messages.push({ text: msg, charIndex: 0, done: false });
      }
    }
  } catch(e) {
    console.error(e);
  }
}

function startApp() {
  const url = document.getElementById('su').value.trim();
  if (!url) { document.getElementById('err').textContent = 'Inserisci un URL.'; return; }
  window._state.scriptUrl = url;
  window._state.started = true;
  document.getElementById('panel').style.display = 'none';
  fetchMessages();
  setInterval(fetchMessages, 2000);
}

function loadBg(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() { window._state.bgImage = img; };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
</script>

<script>
new p5(function(p) {
  const FONT_SIZE    = 52;
  const LINE_H       = 68;
  const TYPING_SPEED = 0.4;   // chars per frame — molto lento
  const MAX_LINES    = 8;     // quante righe mostrare in schermo

  let charIndex  = 0;   // float per velocità sub-1
  let scrollY    = 0;
  let targetScrollY = 0;
  let cursorVisible = true;
  let lastBlink  = 0;

  p.setup = function() {
    p.createCanvas(p.windowWidth, p.windowHeight);
    p.textFont('Caveat');
  };

  p.windowResized = function() {
    p.resizeCanvas(p.windowWidth, p.windowHeight);
  };

  p.draw = function() {
    const s = window._state;

    // Background
    if (s.bgImage) {
      // Cover fit
      const scaleX = p.width  / s.bgImage.width;
      const scaleY = p.height / s.bgImage.height;
      const sc     = Math.max(scaleX, scaleY);
      const bw     = s.bgImage.width  * sc;
      const bh     = s.bgImage.height * sc;
      p.image(s.bgImage, (p.width - bw)/2, (p.height - bh)/2, bw, bh);
    } else {
      p.background(26, 10, 0);
    }

    if (!s.started) return;

    // Advance typing on current message
    const current = s.messages.find(m => !m.done);
    if (current) {
      charIndex += TYPING_SPEED;
      const ci = Math.floor(charIndex);
      if (ci >= current.text.length) {
        current.charIndex = current.text.length;
        current.done = true;
        charIndex = 0;
      } else {
        current.charIndex = ci;
      }
    } else {
      charIndex = 0;
    }

    // Build display lines from all messages (wrapped)
    const maxW = p.width * 0.72;
    p.textFont('Caveat');
    p.textSize(FONT_SIZE);

    let allLines = []; // {text, isTyping, isCursor}
    for (let i = 0; i < s.messages.length; i++) {
      const m = s.messages[i];
      const shown = m.done ? m.text : m.text.substring(0, m.charIndex);
      const wrapped = wrapText(shown, maxW);
      const isTyping = !m.done && i === s.messages.length - 1;
      for (let li = 0; li < wrapped.length; li++) {
        allLines.push({
          text: wrapped[li],
          isLast: isTyping && li === wrapped.length - 1,
        });
      }
    }

    // Scroll so latest lines are visible
    const totalH   = allLines.length * LINE_H;
    const areaH    = p.height * 0.7;
    const centerY  = p.height / 2;
    // Keep last lines centered-ish
    const visLines = Math.min(allLines.length, MAX_LINES);
    targetScrollY  = Math.max(0, allLines.length - visLines) * LINE_H;
    scrollY = p.lerp(scrollY, targetScrollY, 0.05);

    // Draw lines centered
    const startY = centerY - (visLines * LINE_H) / 2 + LINE_H / 2;
    const startIdx = Math.max(0, allLines.length - MAX_LINES);

    p.textAlign(p.CENTER, p.CENTER);
    p.textSize(FONT_SIZE);

    for (let i = 0; i < Math.min(allLines.length, MAX_LINES); i++) {
      const line = allLines[startIdx + i];
      if (!line) continue;
      const y = startY + i * LINE_H;
      const age = i; // 0 = newest visible
      const fadeAlpha = p.map(i, 0, Math.min(allLines.length, MAX_LINES) - 1, 80, 255);

      // Shadow
      p.fill(0, 0, 0, fadeAlpha * 0.5);
      p.text(line.text, p.width / 2 + 2, y + 2);

      // Text
      p.fill(240, 220, 170, fadeAlpha);
      p.text(line.text, p.width / 2, y);

      // Cursor
      if (line.isLast) {
        if (p.millis() - lastBlink > 480) {
          cursorVisible = !cursorVisible;
          lastBlink = p.millis();
        }
        if (cursorVisible) {
          const tw = p.textWidth(line.text);
          p.fill(220, 80, 80, 200);
          p.noStroke();
          p.rect(p.width/2 + tw/2 + 4, y - FONT_SIZE * 0.38, 3, FONT_SIZE * 0.75, 2);
        }
      }
    }

    // Fade old lines at top
    const fadeH = LINE_H * 1.5;
    for (let fy = startY - LINE_H; fy < startY + fadeH; fy++) {
      const a = p.map(fy, startY - LINE_H, startY + fadeH, 0, 255);
      if (s.bgImage) {
        // skip — no fade over image
      } else {
        p.fill(26, 10, 0, 255 - a);
        p.noStroke();
        p.rect(0, fy, p.width, 1);
      }
    }
  };

  function wrapText(text, maxW) {
    if (!text) return [''];
    p.textSize(FONT_SIZE);
    const words = text.split(' ');
    const lines = [];
    let cur = '';
    for (const word of words) {
      const test = cur ? cur + ' ' + word : word;
      if (p.textWidth(test) > maxW && cur) { lines.push(cur); cur = word; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines.length ? lines : [''];
  }
});
</script>
</body>
</html>
